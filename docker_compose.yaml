services:

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - mcp-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-init:
    image: ollama/ollama
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling qwen2.5:7b..."
        ollama pull qwen2.5:7b
        echo "Done."
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - mcp-net
    restart: "no"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=changeme123
      - TOOL_SERVER_CONNECTIONS=[{"type":"openapi","url":"http://mcpo:8082","spec_type":"url","path":"openapi.json","auth_type":"none","key":"","config":{"enable":true},"info":{"id":"kubernetes","name":"Kubernetes","description":"Kubernetes MCP Server"}}]
    depends_on:
      ollama:
        condition: service_healthy
      mcpo:
        condition: service_healthy
    networks:
      - mcp-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  kubernetes-mcp:
    image: ghcr.io/containers/kubernetes-mcp-server:latest
    container_name: kubernetes-mcp
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ${KUBECONFIG:-~/.kube/config}:/tmp/kubeconfig:ro
    environment:
      - KUBECONFIG=/tmp/kubeconfig
    command:
      - --port
      - "8080"
      - --kubeconfig
      - /tmp/kubeconfig
    networks:
      - mcp-net
      - kind
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo
    restart: unless-stopped
    ports:
      - "8082:8082"
    command:
      - --port
      - "8082"
      - --type
      - sse
      - --
      - http://kubernetes-mcp:8080/sse
    depends_on:
      kubernetes-mcp:
        condition: service_started
    networks:
      - mcp-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/openapi.json"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  mcp-net:
    driver: bridge
  kind:
    external: true
    name: kind

volumes:
  ollama:
  open-webui:
