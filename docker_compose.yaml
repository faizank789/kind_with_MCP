version: "3.8"

services:

  # Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - mcp-network

  # Kubernetes MCP Server
  kubernetes-mcp:
    image: ghcr.io/containers/kubernetes-mcp-server:latest
    container_name: mcp-k8s-service
    restart: unless-stopped

    environment:
      KUBECONFIG: /app/kubeconfig

    volumes:
      - ./kubeconfig:/app/kubeconfig:ro

    ports:
      - "8081:8080"

    networks:
      - mcp-network
      - kind

  # MCPO Bridge
  mcpo-bridge:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo-service
    restart: unless-stopped

    depends_on:
      - kubernetes-mcp
    ports:
      - "8000:8000"
    volumes:
      - ./mcpo-config.json:/config.json:ro
    command:
      - --config
      - /config.json
    networks:
      - mcp-network
  # Open WebUI
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: webui-service
    restart: unless-stopped

    depends_on:
      - ollama

    environment:
      OLLAMA_BASE_URL: http://ollama:11434

    ports:
      - "3000:8080"

    volumes:
      - open-webui_data:/app/backend/data

    networks:
      - mcp-network
volumes:
  ollama_data:
  open-webui_data:

networks:
  mcp-network:
    driver: bridge

  kind:
    external: true
